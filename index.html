<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Tools</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f5f6f4;
      --surface: #ffffff;
      --border: #e3e5e0;
      --text: #22272b;
      --text-sub: #5f676d;
      --text-faint: #8a9196;
      --accent: #2f6f62;
      --accent-soft: #e6efec;
      --news: #3d5a80;
      --news-soft: #e7ecf3;
      --shadow: 0 1px 2px rgba(20, 30, 30, 0.04), 0 4px 16px rgba(20, 30, 30, 0.04);
      --shadow-hover: 0 2px 4px rgba(20, 30, 30, 0.06), 0 10px 28px rgba(20, 30, 30, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1d1f;
        --surface: #222628;
        --border: #30353a;
        --text: #e4e6e3;
        --text-sub: #a3a9ad;
        --text-faint: #7b8287;
        --accent: #7fb8a9;
        --accent-soft: #263330;
        --news: #8fa9cc;
        --news-soft: #262d38;
        --shadow: none;
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 72px 0 40px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .lead {
      margin-top: 12px;
      font-size: 16px;
      color: var(--text-sub);
    }

    main { flex: 1; padding-bottom: 64px; }

    section { margin-top: 40px; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .section-head h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-faint);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 9px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      list-style: none;
    }

    .card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      height: 100%;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .icon svg { width: 22px; height: 22px; }

    .news .icon { background: var(--news-soft); color: var(--news); }
    .news .card:hover { border-color: var(--news); }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .arrow {
      color: var(--text-faint);
      transition: transform 0.18s ease, color 0.18s ease;
    }
    .card:hover .arrow { transform: translateX(3px); color: var(--text); }

    .card-desc {
      margin-top: 4px;
      font-size: 14px;
      color: var(--text-sub);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      font-size: 13px;
      color: var(--text-faint);
    }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <p class="eyebrow">Web Tools</p>
      <h1>작은 도구 모음</h1>
      <p class="lead">필요한 기능을 선택하세요.</p>
    </div>
  </header>

  <main>
    <div class="wrap">

      <!-- 재미 -->
      <section aria-labelledby="fun-title">
        <div class="section-head">
          <h2 id="fun-title">재미</h2>
          <span class="count">2</span>
        </div>
        <ul class="grid">
          <li>
            <a class="card" href="ladder.html">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/>
                  <line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="16" x2="17" y2="16"/>
                </svg>
              </span>
              <span class="card-body">
                <span class="card-title">사다리타기 <span class="arrow">→</span></span>
                <span class="card-desc" style="display:block">참가자와 결과를 입력하고 사다리로 정해보세요.</span>
              </span>
            </a>
          </li>
          <li>
            <a class="card" href="rulet.html">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                </svg>
              </span>
              <span class="card-body">
                <span class="card-title">날씨기반 점심고르기 <span class="arrow">→</span></span>
                <span class="card-desc" style="display:block">오늘 날씨에 어울리는 점심 메뉴를 룰렛으로 추천합니다.</span>
              </span>
            </a>
          </li>
        </ul>
      </section>

      <!-- 뉴스 -->
      <section class="news" aria-labelledby="news-title">
        <div class="section-head">
          <h2 id="news-title">뉴스</h2>
          <span class="count">1</span>
        </div>
        <ul class="grid">
          <li>
            <a class="card" href="finance.html">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>
                </svg>
              </span>
              <span class="card-body">
                <span class="card-title">금융뉴스대시보드 <span class="arrow">→</span></span>
                <span class="card-desc" style="display:block">주요 금융 뉴스를 한눈에 모아 봅니다.</span>
              </span>
            </a>
          </li>
        </ul>
      </section>

    </div>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> Web Tools</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
