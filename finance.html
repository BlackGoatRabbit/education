<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --blue-900: #0b2e5e;
      --blue-700: #1554b3;
      --blue-600: #1d64d8;
      --blue-500: #3b7ff0;
      --blue-100: #e6effd;
      --blue-50:  #f3f7fe;
      --ink: #1b2533;
      --muted: #5f6b7c;
      --line: #dfe5ee;
      --bg: #f5f7fb;
      --card: #ffffff;
      --danger: #c62828;
      --danger-bg: #fdecec;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
      color: #fff; padding: 18px 20px;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    header .sub { font-size: 13px; opacity: .8; margin-top: 2px; }
    .btn {
      border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .btn-primary { background: var(--blue-600); color: #fff; }
    .btn-primary:hover { background: var(--blue-700); }
    .btn-light { background: #fff; color: var(--blue-700); }
    .btn-light:hover { background: var(--blue-100); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    main { padding: 18px 0 40px; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px;
    }
    .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--blue-900); }

    /* 키워드 칩 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--blue-100);
      color: var(--blue-700); border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 14px; font-weight: 600;
    }
    .chip button {
      border: 0; background: transparent; color: var(--blue-700); cursor: pointer;
      width: 22px; height: 22px; border-radius: 50%; font-size: 15px; line-height: 1; padding: 0;
    }
    .chip button:hover { background: rgba(29,100,216,.15); }
    .add-row { display: flex; gap: 8px; }
    .input {
      flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      font: inherit; background: #fff; color: var(--ink);
    }
    .input:focus { outline: 2px solid var(--blue-500); outline-offset: -1px; border-color: transparent; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* 요약 */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .stat .label { font-size: 12px; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 700; color: var(--blue-900); margin-top: 2px; }
    .stat .value.small { font-size: 15px; }

    .chart-box { position: relative; height: 260px; }

    /* 오류 */
    .error-box {
      display: none; background: var(--danger-bg); color: var(--danger); border: 1px solid #f5c2c2;
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
    }
    .error-box strong { display: block; margin-bottom: 4px; }
    .error-box ul { margin: 4px 0 0; padding-left: 18px; }

    /* 기사 목록 */
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .list-head h2 { margin: 0; }
    .search { position: relative; flex: 1; max-width: 360px; min-width: 200px; }
    .search .input { width: 100%; padding-left: 34px; }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: var(--blue-500); box-shadow: 0 2px 10px rgba(21,84,179,.08); }
    .card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 11px; font-weight: 600; color: var(--blue-700); background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: 4px; padding: 1px 6px; }
    .card h3 { margin: 0; font-size: 16px; line-height: 1.4; }
    .card h3 a { color: var(--ink); text-decoration: none; }
    .card h3 a:hover { color: var(--blue-700); text-decoration: underline; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-top: auto; gap: 8px; }
    .card .meta a { color: var(--blue-600); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .card .meta a:hover { text-decoration: underline; }
    mark { background: #fff3b0; color: inherit; padding: 0 1px; border-radius: 2px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }

    /* 로딩 */
    .loading {
      position: fixed; inset: 0; background: rgba(245,247,251,.75); display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 50;
      font-weight: 600; color: var(--blue-700);
    }
    .loading.show { display: flex; }
    .spinner { width: 42px; height: 42px; border: 4px solid var(--blue-100); border-top-color: var(--blue-600); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      header h1 { font-size: 18px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .cards { grid-template-columns: 1fr; }
      .chart-box { height: 220px; }
      .search { max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <h1>금융시장 정보 대시보드</h1>
        <div class="sub">네이버 뉴스 검색 · 키워드별 최신 기사 20건</div>
      </div>
      <button id="refreshBtn" class="btn btn-light" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        새로고침
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>키워드</h2>
      <div id="chips" class="chips"></div>
      <form id="addForm" class="add-row" autocomplete="off">
        <input id="kwInput" class="input" type="text" maxlength="30" placeholder="추가할 키워드 입력 (예: 한국은행)">
        <button class="btn btn-primary" type="submit">추가</button>
      </form>
      <div class="hint">키워드를 바꾼 뒤 <b>새로고침</b>을 누르면 반영됩니다. 같은 키워드는 10분간 저장된 결과를 사용합니다.</div>
    </section>

    <div id="errorBox" class="error-box" role="alert"></div>

    <section class="stats">
      <div class="stat"><div class="label">가져온 기사</div><div id="statTotal" class="value">-</div></div>
      <div class="stat"><div class="label">중복 제거 후</div><div id="statUnique" class="value">-</div></div>
      <div class="stat"><div class="label">검색어 적용 결과</div><div id="statFiltered" class="value">-</div></div>
      <div class="stat"><div class="label">마지막 갱신</div><div id="statTime" class="value small">-</div></div>
    </section>

    <section class="panel">
      <h2 id="chartTitle">키워드별 기사 수</h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </section>

    <section>
      <div class="list-head">
        <h2 style="font-size:15px;color:var(--blue-900)">기사 목록</h2>
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="filterInput" class="input" type="search" placeholder="가져온 기사 안에서 단어로 거르기">
        </div>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty">새로고침 버튼을 눌러 기사를 불러오세요.</div>
    </section>
  </main>

  <div id="loading" class="loading" aria-live="polite">
    <div class="spinner"></div>
    <div>기사를 불러오는 중입니다…</div>
  </div>

  <script>
    const DEFAULT_KEYWORDS = ['한전', '전기요금', '정전', '전기차 충전', '재생에너지'];
    const STORAGE_KEY = 'fmd_keywords_v1';
    const MAX_KEYWORDS = 20;

    let keywords = loadKeywords();
    let lastData = null;   // 서버 응답
    let articles = [];     // 중복 제거된 기사 목록
    let chart = null;

    const $ = (id) => document.getElementById(id);

    // ───── 키워드 저장/불러오기 (브라우저별 저장) ─────
    function loadKeywords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length) return saved;
      } catch (e) {}
      return DEFAULT_KEYWORDS.slice();
    }
    function saveKeywords() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(keywords)); } catch (e) {}
    }

    // ───── 키워드 칩 ─────
    function renderChips() {
      const box = $('chips');
      box.innerHTML = '';
      if (!keywords.length) {
        box.innerHTML = '<span class="hint" style="margin:0">키워드가 없습니다. 아래에서 추가해 주세요.</span>';
        return;
      }
      keywords.forEach((kw, i) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = kw;
        const del = document.createElement('button');
        del.type = 'button';
        del.setAttribute('aria-label', kw + ' 삭제');
        del.textContent = '×';
        del.onclick = () => { keywords.splice(i, 1); saveKeywords(); renderChips(); };
        chip.appendChild(del);
        box.appendChild(chip);
      });
    }

    $('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('kwInput');
      const kw = input.value.trim().replace(/\s+/g, ' ');
      if (!kw) return;
      if (keywords.includes(kw)) { showError('이미 등록된 키워드입니다: ' + kw); return; }
      if (keywords.length >= MAX_KEYWORDS) { showError('키워드는 최대 ' + MAX_KEYWORDS + '개까지 등록할 수 있습니다.'); return; }
      keywords.push(kw);
      saveKeywords();
      renderChips();
      hideError();
      input.value = '';
      input.focus();
    });

    // ───── 새로고침 ─────
    $('refreshBtn').addEventListener('click', refresh);

    function refresh() {
      hideError();
      if (!keywords.length) { showError('검색할 키워드가 없습니다. 키워드를 하나 이상 추가해 주세요.'); return; }
      setLoading(true);
      google.script.run
        .withSuccessHandler((data) => {
          setLoading(false);
          lastData = data;
          articles = mergeArticles(data.results);
          const errs = data.results.filter(r => r.error);
          if (errs.length) {
            showError('일부 키워드를 불러오지 못했습니다.', errs.map(r => r.keyword + ': ' + r.error));
          }
          $('statTime').textContent = formatTime(new Date(data.fetchedAt)) +
            (data.results.every(r => r.cached) ? ' (저장된 결과)' : '');
          render();
        })
        .withFailureHandler((err) => {
          setLoading(false);
          showError('기사를 불러오지 못했습니다.', [explainClientError(err)]);
        })
        .getNews(keywords);
    }

    function explainClientError(err) {
      const m = (err && err.message) ? err.message : String(err);
      if (/NetworkError|network|연결/i.test(m)) return '인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
      if (/Authorization|authoriz|권한/i.test(m)) return '스크립트 권한이 승인되지 않았습니다. 편집기에서 testApi 함수를 실행해 권한을 승인해 주세요.';
      if (/exceeded maximum execution time|시간/i.test(m)) return '처리 시간이 너무 오래 걸렸습니다. 키워드 수를 줄여 다시 시도해 주세요.';
      return m.replace(/^Error:\s*/, '');
    }

    // ───── 데이터 가공 ─────
    function cleanText(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function articleKey(it) {
      return (it.originallink || it.link || '').trim().replace(/\/+$/, '');
    }

    // originallink가 같은 기사는 하나로 합치고, 어느 키워드에서 나왔는지 기록
    function mergeArticles(results) {
      const map = new Map();
      results.forEach(r => {
        (r.items || []).forEach(it => {
          const key = articleKey(it) || cleanText(it.title);
          if (!map.has(key)) {
            map.set(key, {
              key,
              title: cleanText(it.title),
              desc: cleanText(it.description),
              url: it.originallink || it.link,
              naverUrl: it.link,
              date: new Date(it.pubDate),
              keywords: [r.keyword]
            });
          } else {
            const a = map.get(key);
            if (!a.keywords.includes(r.keyword)) a.keywords.push(r.keyword);
          }
        });
      });
      return Array.from(map.values()).sort((a, b) => (b.date - a.date) || 0);
    }

    function filterTerm() { return $('filterInput').value.trim().toLowerCase(); }

    function filtered() {
      const t = filterTerm();
      if (!t) return articles;
      const words = t.split(/\s+/);
      return articles.filter(a => {
        const text = (a.title + ' ' + a.desc).toLowerCase();
        return words.every(w => text.includes(w));
      });
    }

    // ───── 화면 그리기 ─────
    function render() {
      if (!lastData) return;
      const list = filtered();
      const total = lastData.results.reduce((s, r) => s + (r.items ? r.items.length : 0), 0);
      $('statTotal').textContent = total.toLocaleString() + '건';
      $('statUnique').textContent = articles.length.toLocaleString() + '건';
      $('statFiltered').textContent = filterTerm() ? list.length.toLocaleString() + '건' : '전체';
      renderChart(list);
      renderCards(list);
    }

    function renderChart(list) {
      const labels = lastData.results.map(r => r.keyword);
      const counts = labels.map(kw => list.filter(a => a.keywords.includes(kw)).length);
      $('chartTitle').textContent = filterTerm()
        ? '키워드별 기사 수 (검색어 "' + $('filterInput').value.trim() + '" 적용)'
        : '키워드별 기사 수';

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = counts;
        chart.update();
        return;
      }
      chart = new Chart($('chart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '기사 수',
            data: counts,
            backgroundColor: '#3b7ff0',
            hoverBackgroundColor: '#1554b3',
            borderRadius: 6,
            maxBarThickness: 48
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (c) => ' ' + c.parsed.y + '건' } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#1b2533', font: { family: 'Pretendard', size: 12 } } },
            y: { beginAtZero: true, suggestedMax: 20, ticks: { precision: 0, color: '#5f6b7c' }, grid: { color: '#eef1f6' } }
          }
        }
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function highlight(text) {
      const safe = escapeHtml(text);
      const t = filterTerm();
      if (!t) return safe;
      const pattern = t.split(/\s+/).map(w => escapeRegExp(escapeHtml(w))).join('|');
      return safe.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
    }

    function safeUrl(u) {
      return /^https?:\/\//i.test(u || '') ? u : '#';
    }

    function renderCards(list) {
      const box = $('cards');
      const empty = $('empty');
      if (!list.length) {
        box.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = articles.length ? '검색어와 일치하는 기사가 없습니다.' : '가져온 기사가 없습니다.';
        return;
      }
      empty.style.display = 'none';
      box.innerHTML = list.map(a => {
        const url = escapeHtml(safeUrl(a.url));
        return '<article class="card">' +
          '<div class="tags">' + a.keywords.map(k => '<span class="tag">' + escapeHtml(k) + '</span>').join('') + '</div>' +
          '<h3><a href="' + url + '" target="_blank" rel="noopener noreferrer">' + highlight(a.title) + '</a></h3>' +
          '<p>' + highlight(a.desc) + '</p>' +
          '<div class="meta"><span>' + formatDate(a.date) + '</span>' +
          '<a href="' + url + '" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>' +
          '</article>';
      }).join('');
    }

    function formatDate(d) {
      if (!(d instanceof Date) || isNaN(d)) return '';
      const diff = (Date.now() - d.getTime()) / 60000;
      let rel = '';
      if (diff >= 0 && diff < 60) rel = Math.max(1, Math.round(diff)) + '분 전';
      else if (diff >= 60 && diff < 1440) rel = Math.round(diff / 60) + '시간 전';
      const abs = d.toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      return rel ? abs + ' · ' + rel : abs;
    }
    function formatTime(d) {
      return d.toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
    }

    // ───── 검색어 거르기 ─────
    let filterTimer = null;
    $('filterInput').addEventListener('input', () => {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(render, 150);
    });

    // ───── 로딩 / 오류 표시 ─────
    function setLoading(on) {
      $('loading').classList.toggle('show', on);
      $('refreshBtn').disabled = on;
    }
    function showError(title, details) {
      const box = $('errorBox');
      box.innerHTML = '<strong>' + escapeHtml(title) + '</strong>' +
        (details && details.length ? '<ul>' + details.map(d => '<li>' + escapeHtml(d) + '</li>').join('') + '</ul>' : '');
      box.style.display = 'block';
    }
    function hideError() { $('errorBox').style.display = 'none'; }

    // ───── 시작 ─────
    renderChips();
    if (typeof Chart === 'undefined') {
      showError('차트 라이브러리(Chart.js)를 불러오지 못했습니다.', ['인터넷 연결 또는 회사 보안 정책을 확인해 주세요. 기사 목록은 정상적으로 볼 수 있습니다.']);
      window.Chart = function () { return { update() {}, data: { labels: [], datasets: [{}] } }; };
    }
    refresh(); // 처음 열 때 자동으로 한 번 불러오기 (10분 캐시 사용)
  </script>
</body>
</html>
